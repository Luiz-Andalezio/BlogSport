<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${category.name} + ' - BlogSport'">Category Posts - BlogSport</title>
    <link rel="icon" type="image/x-icon" th:href="@{/images/favicon.png}" />
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.4.1/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/tailwind.css">
</head>

<body class="bg-white min-h-screen flex">
    <!-- Left sidebar navbar -->
    <div th:replace="fragments/navbar :: navbar"></div>
    <!-- Main content area -->
    <div class="flex-1 flex flex-col">
        <!-- Top bar -->
        <div th:replace="fragments/topbar :: topbar"></div>
        <!-- Breadcrumbs -->
        <nav class="text-sm px-6 py-4 bg-gray-50 border-b border-gray-200 font-semibold mb-4"
            aria-label="Breadcrumb">
            <a href="/" class="text-green-700 hover:underline">Home</a>
            <span class="mx-2 text-gray-400">&gt;</span>
            <span class="text-black-700" th:text="${category.name}">Category</span>
        </nav>
        <h1 class="text-3xl font-bold mb-6 px-6" th:text="${category.name}" style="margin-top: 10px;">Category Posts List</h1>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 px-6">
            <div th:each="post : ${posts}" class="bg-white rounded-lg shadow p-4 flex flex-col">
                <p class="text-xl font-semibold text-green-700"
                    th:text="${post.title}">Post Title</p>
                <div class="text-gray-500 text-sm mt-1">
                    <span th:text="${post.category.name}">Category</span>
                    <span class="mx-1 text-gray-400">&middot;</span>
                    <span th:text="${post.createdAt}">Date</span>
                    <span class="mx-1 text-gray-400">&middot;</span>
                    <span th:text="${post.user.name}">Author</span>
                </div>
                <p class="mt-2 text-gray-700 line-clamp-3" th:text="${post.content}">Post excerpt...</p>
                <a th:href="@{/posts/{id}(id=${post.id})}" class="mt-4 text-green-600 hover:underline text-sm">Read
                    more</a>
            </div>
        </div>
    </div>
</body>

<!-- Right acc management/admin management sidebar navbar -->
<div th:if="${#authorization.expression('hasRole(''ADMIN'')')}">
    <div th:replace="fragments/adminSidebar :: adminSidebar"></div>
</div>

</html>
