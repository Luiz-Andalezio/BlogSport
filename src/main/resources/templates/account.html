<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>My Account - BlogSport</title>
    <link rel="stylesheet" href="/css/tailwind.css">
</head>

<body class="bg-white min-h-screen flex">
    <!-- Left sidebar navbar -->
    <div th:replace="fragments/navbar :: navbar"></div>
    <!-- Main content area -->
    <div class="flex-1 flex flex-col">
        <!-- Top bar -->
        <div th:replace="fragments/topbar :: topbar"></div>
        <!-- Breadcrumbs -->
        <nav class="text-sm px-6 py-4 bg-gray-50 border-b border-gray-200 font-semibold"
            aria-label="Breadcrumb">
            <a href="/" class="text-green-700 hover:underline">Home</a>
            <span class="text-gray-400">&gt;<span>
            <span class="text-gray-700">My Account</a>
        </nav>
        <main class="p-8 max-w-xl mx-auto">
            <h1 class="text-2xl font-bold mb-6">My Account</h1>
            <div class="flex items-center mb-6">
                <img th:src="${user.profileImage != null ? user.profileImage : '/images/profile.png'}" alt="Profile"
                    class="w-20 h-20 rounded-full border mr-6" />
                <div>
                    <div class="font-semibold text-lg" th:text="${user.name}">Name</div>
                    <div class="text-gray-600" th:text="${user.email}">Email</div>
                </div>
            </div>
            <div class="mb-4">
                <span class="font-semibold">Birth date:</span>
                <span th:text="${user.birthDate}">Birth date</span>
            </div>
            <a href="/account/edit" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">Edit
                Account</a>
        </main>
    </div>
    <script src="/js/hidePreview.js"></script>
</body>

</html>
