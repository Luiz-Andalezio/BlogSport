<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Edit Account - BlogSport</title>
    <link rel="icon" type="image/x-icon" th:href="@{/images/favicon.png}" />
    <link rel="stylesheet" href="/css/tailwind.css">
</head>

<body class="bg-white min-h-screen flex">
    <!-- Left sidebar navbar -->
    <div th:replace="home/fragments/navbar :: navbar"></div>
    <!-- Main content area -->
    <div class="flex-1 flex flex-col">
        <!-- Top bar -->
        <div th:replace="home/fragments/topbar :: topbar"></div>
        <!-- Breadcrumbs -->
        <nav class="text-sm px-6 py-4 bg-gray-50 border-b border-gray-200 font-semibold"
            aria-label="Breadcrumb">
            <a href="/" class="text-green-700 hover:underline">Home</a>
            <span class="text-gray-400">&gt;<span>
            <a href="/account" class="text-green-700 hover:underline">My Account</a>
            <span class="text-gray-400">&gt;<span>
            <span class="text-gray-700">Edit Account</span>
        </nav>
        <main class="p-8 max-w-xl mx-auto">
            <h1 class="text-2xl font-bold mb-6">Edit Account</h1>
            <div th:replace="user/fragments/accountEditForm :: accountEditForm"></div>
        </main>
    </div>
</body>

<!-- Right acc management/admin management sidebar navbar -->
<div th:if="${#authorization.expression('hasRole(''ADMIN'')')}">
    <div th:replace="admin/fragments/adminSidebar :: adminSidebar"></div>
</div>

</html>
