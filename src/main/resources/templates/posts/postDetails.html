<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title th:text="${post.title} + ' - BlogSport'">Post Details - BlogSport</title>
    <link rel="icon" type="image/x-icon" th:href="@{/images/favicon.png}" />
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.4.1/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/tailwind.css">

    <link href="https://cdn.jsdelivr.net/npm/summernote@0.8.18/dist/summernote-lite.min.css" rel="stylesheet">
</head>

<body class="bg-white min-h-screen flex">
    <div th:replace="home/fragments/navbar :: navbar"></div>
    <div class="flex-1 flex flex-col">
        <div th:replace="home/fragments/topbar :: topbar"></div>
        <nav class="text-sm px-6 py-4 bg-gray-50 border-b border-gray-200 font-semibold"
            aria-label="Breadcrumb">
            <a href="/" class="text-green-700 hover:underline">Home</a>
            <span class="text-gray-400">&gt;</span>
            <a th:href="@{/categories/{id}(id=${post.category.id})}" class="text-green-700 hover:underline"
                th:text="${post.category.name}">Category</a>
            <span class="text-gray-400">&gt;</span>
            <span class="text-gray-700" th:text="${post.title}">Post Title</span>
        </nav>
        <main class="p-8 max-w-3xl">
            <h1 class="text-3xl font-bold text-green-700 mb-4" th:text="${post.title}">Post Title</h1>
            <div class="text-gray-500 text-sm mb-6 mt-1">
                <span th:text="${post.category.name}">Category</span> &middot; 
                <span th:text="${post.createdAt}">Date</span> &middot; 
                <span th:text="${post.user.name}">Author</span>
                <span th:text="${post.commentCount} + ' comments'">0 comments</span> <!-- Exibe a contagem de comentários -->

            </div>
            <div class="prose max-w-none text-gray-800" th:utext="${post.content}">
                Post content here...
            </div>
            <div th:if="${post.imageUrl}" class="mt-6">
                <img th:src="@{${post.imageUrl}}" alt="Post image" class="rounded-lg shadow max-h-96 w-auto mx-auto">
            </div>
            <div class="post-comments mt-8"> <!-- linha de inserir comentarios-->
                <h2 class="text-xl font-semibold text-green-700 mb-4">Comments</h2>
                <div th:if="${#lists.isEmpty(comments)}" class="text-gray-500">No comments yet.</div>
                <ul>
                    <li th:each="comment : ${comments}" class="mb-4 border-b pb-2">
                        <p><strong th:text="${comment.user.name}">Author</strong>: <span th:text="${comment.content}">Comment content</span></p>
                    </li>
                </ul>
                <form th:action="@{/comments/post/{postId}(postId=${post.id})}" method="post" class="mt-4">
                    <textarea id="summernote-comment-area" name="content" placeholder="Write your comment here..." required class="w-full border rounded p-2"></textarea>
                    <button type="submit" class="btn btn-primary mt-2 balc">Submit Comment</button>
                </form>
            </div> <!-- fim da linha de inserir comentarios-->
            <div class="comments-section mt-8">
                <h2 class="text-xl font-bold mb-4">Comments (<span th:text="${post.commentCount}">0</span>)</h2>
                <ul>
                    <li th:each="comment : ${comments}" class="mb-4 border-b pb-2">
                        <p><strong th:text="${comment.user.name}">Author</strong>: <span th:text="${comment.content}">Comment content</span></p>
                    </li>
                </ul>
            </div>
                </ul>
            </div>
        </main>
    </div>
    <script src="/js/hidePreview.js"></script>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/summernote@0.8.18/dist/summernote-lite.min.js"></script>

    <script>
        $(document).ready(function() {
            // Inicializa o Summernote no textarea com o ID 'summernote-comment-area'
            $('#summernote-comment-area').summernote({
                tabsize: 2,
                height: 120, // Altura do editor
                toolbar: [ // Barra de ferramentas personalizada (opcional)
                    ['style', ['style']],
                    ['font', ['bold', 'underline', 'clear']],
                    ['color', ['color']],
                    ['para', ['ul', 'ol', 'paragraph']],
                    ['table', ['table']],
                    ['insert', ['link', 'picture']],
                    ['view', ['fullscreen', 'codeview', 'help']]
                ]
            });
        });
    </script>
</body>

</html>
