<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
  <meta charset="UTF-8" />
  <title>New Post</title>
  <link rel="icon" type="image/x-icon" th:href="@{/images/favicon.png}" />
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.4.1/dist/tailwind.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/css/tailwind.css" />

  <link href="https://cdn.jsdelivr.net/npm/summernote@0.8.18/dist/summernote-lite.min.css" rel="stylesheet" />
</head>

<body class="bg-white min-h-screen flex">
  <div th:replace="home/fragments/navbar :: navbar"></div>
  <div class="flex-1 flex flex-col">
    <div th:replace="home/fragments/topbar :: topbar"></div>

    <!--  start of Breadcrumbs -->
    <nav class="text-sm px-6 py-4 bg-gray-50 border-b border-gray-200 font-semibold" aria-label="Breadcrumb">
      <a href="/" class="text-green-700 hover:underline">Home</a>
      <span class="text-gray-400">&gt;</span>
      <span class="text-gray-400">Create new post</span>
    </nav>
    <!--  end of  Breadcrumbs -->

    <main class="flex-1 bg-white p-8">
      <div class="max-w-4xl mx-auto bg-white p-6 rounded-lg">
        <!-- Start of Post Form -->
        <div sec:authorize="hasRole('ROLE_ADMIN')">
          <form th:action="@{/posts/create}" method="post" class="space-y-6">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <div class="mb-4">
              <label for="title" class="block text-2xl font-semibold text-gray-900">Title</label>
              <input type="text" id="title" name="title" th:field="*{post.title}"
                class="w-full px-3 py-2 text-lg border border-black focus:outline-none bg-transparent" required />
            </div>
            <div class="mb-4">
              <label for="CategoryId" class="block text-2xl font-semibold text-gray-900 mb-2">
                Category
              </label>
              <select name="categoryId" id="categoryId"
                class="w-full px-3 py-2 text-lg border border-black focus:outline-none bg-transparent appearance-none cursor-pointer"
                required>
                <option value="" disabled selected>Select a category</option>
                <option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}"
                  class="bg-white">
                </option>
              </select>
            </div>
            <div class="mb-4">
              <label for="content" class="block text-2xl font-semibold text-gray-900 mb-2">Content</label>
              <textarea id="content" name="content" class="w-full" required></textarea>
              <input type="hidden" id="contentHidden" th:field="*{post.content}" />
            </div>

            <div class="flex justify-end">
              <button type="submit"
                class="px-6 py-2 bg-green-50 hover:bg-green-100 text-black border border-black rounded transition-colors">
                Create Post
              </button>
            </div>
          </form>
          <!-- End of Post Form -->
        </div>
      </div>
    </main>
  </div>

  <script src="/js/modal.js"></script>
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/summernote@0.8.18/dist/summernote-lite.min.js"></script>
  <script>
    $(document).ready(function () {
      $('#content').summernote({
        tabsize: 2,
        height: 300,
        placeholder: 'Write your post content here...',
        toolbar: [
          ['style', ['style']],
          ['font', ['bold', 'underline', 'italic', 'clear']],
          ['para', ['ul', 'ol', 'paragraph']],
          ['table', ['table']],
          ['view', ['fullscreen']]
        ]
      });
    });
  </script>

</body>

</html>
