<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
  <meta charset="UTF-8" />
  <title>Manage Categories - BlogSport</title>
  <link rel="icon" type="image/x-icon" th:href="@{/images/favicon.png}" />
  <link rel="stylesheet" href="/css/tailwind.css" />
</head>

<body class="bg-white min-h-screen flex">
  <div th:replace="home/fragments/navbar :: navbar"></div>
  <div class="flex-1 flex flex-col">
    <div th:replace="home/fragments/topbar :: topbar"></div>

    <!-- Breadcrumbs -->
    <nav class="text-sm px-6 py-4 bg-gray-50 border-b border-gray-200 font-semibold" aria-label="Breadcrumb">
      <a href="/" class="text-green-700 hover:underline">Home</a>
      <span class="text-gray-400">&gt;</span>
      <span class="text-gray-400">Manage Categories</span>
    </nav>

    <main class="flex-1 p-6">
      <div class="max-w-2xl mx-auto">
        <h1 class="text-3xl font-bold text-gray-900 mb-6"> Categories</h1>

        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
          <h2 class="text-xl font-semibold text-gray-800 mb-4">Create New Category</h2>
          <form th:action="@{/categories/save}" method="post">
            <div class="mb-4">
              <label for="categoryName" class="block text-sm font-medium text-gray-700 mb-2">Category Name</label>
              <input type="text" id="categoryName" name="categoryName"
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent"
                placeholder="Enter category name" required />
            </div>
            <div class="flex gap-3">
              <button th:action="@{/categories/save}" type="submit"
                class="px-4 py-2 bg-green-600 hover:bg-green-700 text-white font-medium rounded-md transition-colors duration-200">
                Save Category
              </button>
              <a href="/"
                class="px-4 py-2 bg-gray-500 hover:bg-gray-600 text-white font-medium rounded-md transition-colors duration-200">
                Cancel
              </a>
            </div>
          </form>
        </div>
      </div>

      <!-- Categories List -->
      <div class="bg-white rounded-lg shadow-md overflow-hidden">
        <div class="px-6 py-4 bg-gray-50 border-b border-gray-200">
          <h2 class="text-xl font-semibold text-gray-800">All Categories</h2>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full">
            <thead class="bg-gray-50">
              <tr>
                <th class="px-6 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">Name</th>
                <th class="px-6 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">Posts Count
                </th>
                <th class="px-6 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">Actions
                </th>
              </tr>
            </thead>
            <tbody class="bg-white divide-y divide-gray-200">
              <tr th:each="category : ${categories}" class="hover:bg-gray-50">
                <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900 text-center"
                  th:text="${category.name}"></td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500 text-center"
                  th:text="${category.posts != null ? category.posts.size() : 0}"></td>
                <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                  <div class="flex justify-center gap-2">
                    <!-- Edit Button -->
                    <a th:href="@{/categories/{id}/edit(id=${category.id})}"
                      class="px-3 py-1 bg-blue-600 hover:bg-blue-700 text-white text-xs font-medium rounded transition-colors duration-200"
                      title="Edit Category">
                      ✏️ Edit
                    </a>

                    <!-- Delete Button -->
                    <form th:action="@{/categories/{id}/delete(id=${category.id})}" method="post" class="inline"
                      onsubmit="return confirm('Deseja mesmo deletar esta categoria?')">
                      <button type="submit"
                        class="px-3 py-1 bg-red-600 hover:bg-red-700 text-white text-xs font-medium rounded transition-colors duration-200"
                        title="Delete Category">
                        🗑️ Delete
                      </button>
                    </form>
                  </div>
                </td>
              </tr>

              <!-- Empty state -->
              <tr th:if="${#lists.isEmpty(categories)}">
                <td colspan="4" class="px-6 py-8 text-center text-gray-500">
                  <div class="text-lg mb-2">No categories found</div>
                  <div class="text-sm">Create your first category using the form above.</div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
  </div>
  </main>
  </div>
</body>

</html>
