<div th:fragment="editPostFragments(post)">
    <form th:action="@{/posts/{id}/edit(id=${post.id})}" method="post" class="space-y-6">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        
        <!-- Title Field -->
        <div class="mb-4">
            <label for="title" class="block text-2xl font-semibold text-gray-900">Title</label>
            <input type="text" 
                   id="title" 
                   name="title" 
                   th:value="${post.title}" 
                   class="w-full px-3 py-2 text-lg border border-black focus:outline-none bg-transparent" 
                   required />
        </div>

        <!-- Category Field -->
        <div class="mb-4">
            <label for="categoryId" class="block text-2xl font-semibold text-gray-900 mb-2">Category</label>
            <select name="categoryId"
                    id="categoryId"
                    class="w-full px-3 py-2 text-lg border border-black focus:outline-none bg-transparent appearance-none cursor-pointer"
                    required>
                <option th:each="category : ${categories}"
                        th:value="${category.id}"
                        th:text="${category.name}"
                        th:selected="${category.id == post.category.id}"
                        class="bg-white">
                </option>
            </select>
        </div>

        <!-- Content Field -->
        <div class="mb-4">
            <label for="content" class="block text-2xl font-semibold text-gray-900 mb-2">Content</label>
            <textarea id="content" 
                      name="content" 
                      class="w-full" 
                      th:text="${post.content}"
                      required></textarea>
            <input type="hidden" id="contentHidden" name="content" th:value="${post.content}" />
        </div>

        <!-- Action Buttons -->
        <div class="flex justify-end gap-3">
            <a th:href="@{/posts/{id}(id=${post.id})}" 
               class="px-6 py-2 bg-gray-50 hover:bg-gray-100 text-black border border-black rounded transition-colors">
                ❌ Cancelar
            </a>
            <button type="submit" 
                    class="px-6 py-2 bg-green-50 hover:bg-green-100 text-black border border-black rounded transition-colors">
                💾 Salvar
            </button>
        </div>
    </form>

    <!-- Summernote Initialization -->
    <script>
        $(document).ready(function() {
            $('#content').summernote({
                tabsize: 2,
                height: 300,
                toolbar: [
                    ['style', ['style']],
                    ['font', ['bold', 'underline', 'italic', 'clear']],
                    ['para', ['ul', 'ol', 'paragraph']],
                    ['table', ['table']],
                    ['view', ['fullscreen']]
                ],
                callbacks: {
                    onChange: function(contents) {
                        $('#contentHidden').val(contents);
                    }
                }
            });
        });
    </script>
</div>
