<div
  th:fragment="postsList"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
  <h1 class="text-3xl font-bold mb-6">Latest Posts</h1>
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    <div
      th:each="post : ${posts}"
      class="bg-white rounded-lg shadow p-4 flex flex-col relative"
    >
      <!-- Header com título e botão deletar -->
      <div class="flex items-start justify-between mb-1">
        <!-- Título -->
        <a class="text-xl font-semibold text-green-700 flex-1" th:text="${post.title}"
          >Post Title</a
        >

        <!-- Botão deletar  -->
        <div sec:authorize="hasRole('ROLE_ADMIN')" class="ml-2">
          <form
            th:action="@{/posts/{id}/delete(id=${post.id})}"
            method="post"
            class="inline-block"
          >
            <button
              type="submit"
              class="px-2 py-1 text-red-600 hover:text-white hover:bg-red-600 transition-colors text-xs border border-red-200 rounded"
              onclick="return confirm('Are you sure you want to delete this post?')"
              title="Delete post"
            >
              🗑️ Delete
            </button>
          </form>
        </div>
      </div>
      <div class="text-gray-500 text-sm mt-1">
        <span th:text="${post.category.name}">Category</span> &middot;
        <span th:text="${post.createdAt}">Date</span> &middot;
        <span th:text="${post.user.name}">Author</span>
      </div>
      <p class="mt-2 text-gray-700 line-clamp-3" th:text="${post.content}">
        Post excerpt...
      </p>
      <a
        th:href="@{/posts/{id}(id=${post.id})}"
        class="mt-4 text-green-600 hover:underline text-sm"
        >Read more</a
      >
      <div class="post-actions mt-4 flex items-center gap-4">
        <a
          th:href="@{/likes/post/{id}/toggle(id=${post.id})}"
          class="btn btn-like"
        >
          👍(<span th:text="${post.likeCount}">0</span>)
        </a>
        <a
          th:href="@{/posts/{id}(id=${post.id})}"
          class="btn btn-comment"
          style="padding-left: 30px"
        >
          💬 (<span th:text="${post.commentCount}">0</span>)
        </a>
      </div>
    </div>
  </div>
</div>
