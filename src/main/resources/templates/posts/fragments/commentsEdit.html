<div th:fragment="commentsEdit(comment)">
    <form th:action="@{/comments/{id}/edit(id=${comment.id})}" method="post" class="space-y-3">
        <textarea 
            id="summernote-comment-edit-area" 
            name="content"
            required 
            class="w-full border rounded p-3 min-h-20 focus:outline-none focus:ring-2 focus:ring-blue-500"
            th:text="${comment.content}"
        ></textarea>
        <div class="flex items-center space-x-2">
            <button 
                type="submit" 
                class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded text-sm transition-colors"
            >
                💾 Salvar
            </button>
            <a 
                th:href="@{/posts/{id}(id=${comment.post.id})}" 
                class="bg-gray-500 hover:bg-gray-600 text-white px-4 py-2 rounded text-sm transition-colors"
            >
                ❌ Cancelar
            </a>
        </div>
    </form>
</div>
