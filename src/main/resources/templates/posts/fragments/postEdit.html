<!--- Fragment para edição inline de post -->
<div th:fragment="postEdit(post)" class="bg-white rounded-lg p-4">
    <form th:action="@{/posts/{id}/edit(id=${post.id})}" method="post" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700">Título</label>
            <input type="text" name="title" th:value="${post.title}" required
                   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-green-500 focus:ring-green-500">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700">Categoria</label>
            <select name="categoryId" required
                    class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-green-500 focus:ring-green-500">
                <option th:each="category : ${categories}"
                        th:value="${category.id}"
                        th:text="${category.name}"
                        th:selected="${category.id == post.category.id}">
                    Category
                </option>
            </select>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700">Conteúdo</label>
            <textarea id="summernote-edit-area" name="content" required
                      class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-green-500 focus:ring-green-500"
                      th:text="${post.content}"></textarea>
        </div>

        <div class="flex justify-end space-x-3">
            <a th:href="@{/posts/{id}(id=${post.id})}"
               class="px-4 py-2 text-sm border border-gray-300 rounded-md shadow-sm text-gray-700 bg-white hover:bg-gray-50">
                Cancelar
            </a>
            <button type="submit"
                    class="inline-flex justify-center px-4 py-2 text-sm border border-black text-black bg-green-50 hover:bg-green-100 rounded-md shadow-sm">
                Salvar Alterações
            </button>
        </div>
    </form>
</div>

<script th:fragment="postEditScripts">
    $(document).ready(function() {
        $('#summernote-edit-area').summernote({
            tabsize: 2,
            height: 300,
            toolbar: [
                ['style', ['style']],
                ['font', ['bold', 'underline', 'clear']],
                ['color', ['color']],
                ['para', ['ul', 'ol', 'paragraph']],
                ['table', ['table']],
                ['insert', ['link', 'picture']],
                ['view', ['fullscreen', 'codeview', 'help']]
            ],
            callbacks: {
                onInit: function() {
                    // Foca no editor quando ele é inicializado
                    $(this).summernote('focus');
                }
            }
        });
    });
</script>
