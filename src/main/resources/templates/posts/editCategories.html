<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
  <meta charset="UTF-8" />
  <title th:text="'Editar: ' + ${category.name} + ' - BlogSport'">
    Editar Category - BlogSport
  </title>
  <link rel="icon" type="image/x-icon" th:href="@{/images/favicon.png}" />
  <link rel="stylesheet" href="/css/tailwind.css" />
</head>

<body class="bg-white min-h-screen flex">
  <div th:replace="home/fragments/navbar :: navbar"></div>
  <div class="flex-1 flex flex-col">
    <div th:replace="home/fragments/topbar :: topbar"></div>
    <nav class="text-sm px-6 py-4 bg-gray-50 border-b border-gray-200 font-semibold" aria-label="Breadcrumb">
      <a href="/" class="text-green-700 hover:underline">Home</a>
      <span class="text-gray-400">&gt;</span>
      <a th:href="@{/categories/categoriesCrud}" class="text-green-700 hover:underline">Categories</a>
      <span class="text-gray-400">&gt;</span>
      <span class="text-gray-700">Edit</span>
    </nav>
    <main class="flex-1 p-6">
      <div class="max-w-2xl mx-auto">
        <h1 class="text-3xl font-bold text-gray-900 mb-6">Edit Category</h1>

        <div class="bg-white rounded-lg shadow-md p-6">
          <h2 class="text-xl font-semibold text-gray-800 mb-4">Edit Category Details</h2>
          <form th:action="@{/categories/{id}/edit(id=${category.id})}" th:object="${category}" method="post">
            <div class="mb-4">
              <label for="name" class="block text-sm font-medium text-gray-700 mb-2">Category Name</label>
              <input type="text" id="name" name="name" th:field="*{name}"
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent"
                placeholder="Enter category name" required />
            </div>
            <div class="flex gap-3">
              <button type="submit"
                class="px-4 py-2 bg-green-600 hover:bg-green-700 text-white font-medium rounded-md transition-colors duration-200">
                Save Changes
              </button>
              <a th:href="@{/categories/categoriesCrud}"
                class="px-4 py-2 bg-gray-500 hover:bg-gray-600 text-white font-medium rounded-md transition-colors duration-200">
                Cancel
              </a>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>
</body>

</html>
