<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title th:text="'Editar: ' + ${post.title} + ' - BlogSport'">Editar Post - BlogSport</title>
    <link rel="icon" type="image/x-icon" th:href="@{/images/favicon.png}" />
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.4.1/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/tailwind.css">
    <link href="https://cdn.jsdelivr.net/npm/summernote@0.8.18/dist/summernote-lite.min.css" rel="stylesheet">
</head>

<body class="bg-white min-h-screen flex">
    <div th:replace="home/fragments/navbar :: navbar"></div>
    <div class="flex-1 flex flex-col">
        <div th:replace="home/fragments/topbar :: topbar"></div>
        <nav class="text-sm px-6 py-4 bg-gray-50 border-b border-gray-200 font-semibold" aria-label="Breadcrumb">
            <a href="/" class="text-green-700 hover:underline">Home</a>
            <span class="text-gray-400">&gt;</span>
            <a th:href="@{/categories/{id}(id=${post.category.id})}" class="text-green-700 hover:underline"
                th:text="${post.category.name}">Category</a>
            <span class="text-gray-400">&gt;</span>
            <a th:href="@{/posts/{id}(id=${post.id})}" class="text-green-700 hover:underline"
                th:text="${post.title}">Post Title</a>
            <span class="text-gray-400">&gt;</span>
            <span class="text-gray-700">Editar</span>
        </nav>
        <main class="flex-1 bg-white p-8">
            <div class="max-w-4xl mx-auto">
                <!-- Formulário de Edição -->
                <div class="bg-white rounded-lg shadow-md overflow-hidden mb-8">
                    <div class="p-6">
                        <h1 class="text-3xl font-bold text-green-700 mb-6">Editar Post</h1>
                        <form th:action="@{/posts/{id}/edit(id=${post.id})}" method="post" class="space-y-6">
                            <div>
                                <label for="title" class="block text-sm font-medium text-gray-700">Título</label>
                                <input type="text" id="title" name="title" th:value="${post.title}" required
                                    class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 focus:border-green-500 focus:ring-green-500">
                            </div>

                            <div>
                                <label for="categoryId"
                                    class="block text-sm font-medium text-gray-700">Categoria</label>
                                <select id="categoryId" name="categoryId" required
                                    class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 focus:border-green-500 focus:ring-green-500">
                                    <option th:each="category : ${categories}" th:value="${category.id}"
                                        th:text="${category.name}" th:selected="${category.id == post.category.id}">
                                    </option>
                                </select>
                            </div>

                            <div>
                                <label for="content" class="block text-sm font-medium text-gray-700">Conteúdo</label>
                                <textarea id="summernote-edit-area" name="content" required
                                    th:text="${post.content}"></textarea>
                            </div>

                            <div class="flex justify-end gap-3">
                                <a th:href="@{/posts/{id}(id=${post.id})}"
                                    class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-md hover:bg-gray-50">
                                    Cancelar
                                </a>
                                <button type="submit"
                                    class="px-4 py-2 text-sm font-medium text-white bg-green-600 border border-green-600 rounded-md hover:bg-green-700">
                                    Salvar Alterações
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="/js/modal.js"></script>
    <script src="/js/hidePreview.js"></script>
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/summernote@0.8.18/dist/summernote-lite.min.js"></script>
    <script>
        $(document).ready(function () {
            // Configuração da barra de ferramentas
            var toolbarOptions = [
                ['style', ['style']],
                ['font', ['bold', 'underline', 'clear']],
                ['color', ['color']],
                ['para', ['ul', 'ol', 'paragraph']],
                ['table', ['table']],
                ['insert', ['link', 'picture']],
                ['view', ['fullscreen', 'codeview', 'help']]
            ];

            // Inicializa o editor Summernote
            $('#summernote-edit-area').summernote({
                tabsize: 2,
                height: 400,
                toolbar: toolbarOptions,
                callbacks: {
                    onInit: function () {
                        $(this).summernote('focus');
                    }
                }
            });
        });
    </script>
    
</body>

</html>
