<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title th:text="${user.id != null ? 'Edit User' : 'Create User'} + ' - BlogSport'">User Form - BlogSport</title>
    <link rel="icon" type="image/x-icon" th:href="@{/images/favicon.png}" />
    <link rel="stylesheet" href="/css/tailwind.css">
</head>

<body class="bg-white min-h-screen flex">
    <!-- Sidebar -->
    <div th:replace="home/fragments/navbar :: navbar"></div>
    <!-- Main content -->
    <div class="flex-1 flex flex-col">
        <!-- Topbar -->
        <div th:replace="home/fragments/topbar :: topbar"></div>
        <!-- Breadcrumbs -->
        <nav class="text-sm px-6 py-4 bg-gray-50 border-b border-gray-200 font-semibold" aria-label="Breadcrumb">
            <a href="/" class="text-green-700 hover:underline">Home</a>
            <span class="text-gray-400">&gt;</span>
            <a href="/admin/users" class="text-green-700 hover:underline">User Management</a>
            <span class="text-gray-400">&gt;</span>
            <span class="text-gray-700" th:text="${user.id != null ? 'Edit User' : 'Create User'}"></span>
        </nav>
        <main class="p-8 max-w-xl mx-auto w-full">
            <h1 class="text-2xl font-bold mb-6" th:text="${user.id != null ? 'Edit User' : 'Create User'}"></h1>
            <form th:action="@{${user.id != null} ? '/admin/users/edit/' + ${user.id} : '/admin/users/create'}"
                method="post" class="space-y-4">
                <div>
                    <label class="block font-semibold mb-1">Name:</label>
                    <input type="text" name="name" th:value="${user.name}" required
                        class="border rounded px-3 py-2 w-full">
                </div>
                <div>
                    <label class="block font-semibold mb-1">Email:</label>
                    <input type="email" name="email" th:value="${user.email}" required
                        class="border rounded px-3 py-2 w-full">
                </div>
                <div th:if="${user.id == null}">
                    <label class="block font-semibold mb-1">Password:</label>
                    <input type="password" name="password" required class="border rounded px-3 py-2 w-full">
                </div>
                <div>
                    <label class="block font-semibold mb-1">Role:</label>
                    <select name="role" class="border rounded px-3 py-2 w-full" required>
                        <option th:selected="${user.role == null || user.role.name() == 'USER'}" value="USER">User
                        </option>
                        <option th:selected="${user.role != null && user.role.name() == 'ADMIN'}" value="ADMIN">
                            Administrator</option>
                    </select>
                </div>

                <div class="flex gap-4">

                    <a th:if="${user.id != null}" th:href="@{'/admin/users/change-password/' + ${user.id}}"
                        class="text-green-700 hover:underline">
                        Edit this user password
                    </a>
                </div>
                <div class="flex gap-4">
                    <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700"
                        onclick="return confirm('Are you sure about this operation?');">
                        <span th:text="${user.id != null ? 'Save Changes' : 'Create User'}"></span>
                    </button>
                    <a href="/admin/users" class="bg-gray-400 text-white px-4 py-2 rounded hover:bg-gray-600">Cancel</a>
                </div>
            </form>
        </main>
    </div>
</body>

</html>
