<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Change User Password - BlogSport</title>
    <link rel="stylesheet" href="/css/tailwind.css">
</head>
<body class="bg-white min-h-screen flex">
    <div th:replace="home/fragments/navbar :: navbar"></div>
    <div class="flex-1 flex flex-col">
        <div th:replace="home/fragments/topbar :: topbar"></div>
        <main class="p-8 max-w-xl mx-auto w-full">
            <h1 class="text-2xl font-bold mb-6">Change Password for <span th:text="${user.name}"></span></h1>
            <form th:action="@{'/admin/users/change-password/' + ${user.id}}" method="post" class="space-y-4">
                <div>
                    <label class="block font-semibold mb-1">New Password:</label>
                    <input type="password" name="newPassword" required class="border rounded px-3 py-2 w-full">
                </div>
                <div>
                    <label class="block font-semibold mb-1">Confirm Password:</label>
                    <input type="password" name="confirmPassword" required class="border rounded px-3 py-2 w-full">
                </div>
                <div th:if="${error}" class="text-red-600" th:text="${error}"></div>
                <div class="flex gap-4">
                    <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700"
                        onclick="return confirm('Are you sure you want to change the password for this user?');">Change Password</button>
                    <a href="/admin/users" class="bg-gray-400 text-white px-4 py-2 rounded hover:bg-gray-600">Cancel</a>
                </div>
            </form>
        </main>
    </div>

    <script src="/js/modal.js"></script>
    <script src="/js/hidePreview.js"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    
</body>

</html>
