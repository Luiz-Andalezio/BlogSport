<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>Users CRUD - BlogSport</title>
    <link rel="icon" type="image/x-icon" th:href="@{/images/favicon.png}" />
    <link rel="stylesheet" href="/css/tailwind.css">
</head>

<body class="bg-white min-h-screen flex">
    <!-- Sidebar -->
    <div th:replace="~{home/fragments/navbar :: navbar}"></div>
    <!-- Main content -->
    <div class="flex-1 flex flex-col">
        <!-- Topbar -->
        <div th:replace="~{home/fragments/topbar :: topbar}"></div>
        <!-- Breadcrumbs -->
        <nav class="text-sm px-6 py-4 bg-gray-50 border-b border-gray-200 font-semibold flex justify-between items-center"
            aria-label="Breadcrumb">
            <div>
                <a href="/" class="text-green-700 hover:underline">Home</a>
                <span class="text-gray-400">&gt;</span>
                <span class="text-gray-700">User Management</span>
            </div>
            <a href="/admin/users/create"
                class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 transition-colors">Create User</a>
        </nav>
        <main class="p-8 max-w-4xl mx-auto w-full">
            <h1 class="text-2xl font-bold mb-6">User Management</h1>
            <div class="mb-8">
                <h2 class="text-xl font-semibold mb-2">Administrators</h2>
                <div class="overflow-x-auto">
                    <table class="min-w-full bg-white border rounded mb-4">
                        <thead>
                            <tr>
                                <th class="px-4 py-2 border-b">Name</th>
                                <th class="px-4 py-2 border-b">Email</th>
                                <th class="px-4 py-2 border-b">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="admin : ${admins}">
                                <td class="px-4 py-2 border-b" th:text="${admin.name}"></td>
                                <td class="px-4 py-2 border-b" th:text="${admin.email}"></td>
                                <td class="px-4 py-2 border-b flex gap-2">
                                    <span th:if="${admin.id} == ${currentUser.id}" class="italic text-green-700">Current Account</span>
                                    <span th:if="${admin.id} != ${currentUser.id}">
                                        <div class="flex items-center justify-center gap-2">
                                            <a th:href="@{'/admin/users/edit/' + ${admin.id}}"
                                                class="min-w-[70px] text-center px-3 py-1 bg-green-600 text-white rounded hover:bg-green-700 transition-colors">Edit</a>
                                            <form th:action="@{'/admin/users/delete/' + ${admin.id}}" method="post" style="display:inline;">
                                                <button type="submit"
                                                    class="min-w-[70px] text-center px-3 py-1 bg-red-600 text-white rounded hover:bg-red-700 transition-colors"
                                                    onclick="return confirm('Are you sure you want to delete this user?');">Delete</button>
                                            </form>
                                        </div>
                                    </span>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(admins)}">
                                <td colspan="3" class="text-center text-gray-500 py-2">No administrators found.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div>
                <h2 class="text-xl font-semibold mb-2">Users</h2>
                <div class="overflow-x-auto">
                    <table class="min-w-full bg-white border rounded">
                        <thead>
                            <tr>
                                <th class="px-4 py-2 border-b">Name</th>
                                <th class="px-4 py-2 border-b">Email</th>
                                <th class="px-4 py-2 border-b">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="user : ${users}">
                                <td class="px-4 py-2 border-b" th:text="${user.name}"></td>
                                <td class="px-4 py-2 border-b" th:text="${user.email}"></td>
                                <td class="px-4 py-2 border-b flex gap-2">
                                    <span th:if="${user.id} == ${currentUser.id}" class="italic text-green-700">Current Account</span>
                                    <span th:if="${user.id} != ${currentUser.id}">
                                        <div class="flex items-center justify-center gap-2">
                                            <a th:href="@{'/admin/users/edit/' + ${user.id}}"
                                                class="min-w-[70px] text-center px-3 py-1 bg-green-600 text-white rounded hover:bg-green-700 transition-colors">Edit</a>
                                            <form th:action="@{'/admin/users/delete/' + ${user.id}}" method="post" style="display:inline;">
                                                <button type="submit"
                                                    class="min-w-[70px] text-center px-3 py-1 bg-red-600 text-white rounded hover:bg-red-700 transition-colors"
                                                    onclick="return confirm('Are you sure you want to delete this user?');">Delete</button>
                                            </form>
                                        </div>
                                    </span>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(users)}">
                                <td colspan="3" class="text-center text-gray-500 py-2">No users found.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</body>

</html>
