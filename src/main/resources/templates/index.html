<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle}">BlogSport</title>
    <link rel="icon" type="image/x-icon" th:href="@{/images/favicon.png}" />
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.4.1/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/index.css"> 
    <link rel="stylesheet" href="css/tailwind.css">
</head>

<body class="bg-white min-h-screen flex">
    <!-- Sidebar navbar -->
    <div th:replace="fragments/navbar :: navbar"></div>
    <!-- Main content area -->
    <div class="flex-1 flex flex-col">
        <!-- Top bar -->
        <div th:replace="fragments/topbar :: topbar"></div>
        <!-- Dynamic page content -->
        <main class="p-6">
            <div th:replace="fragments/postsList :: postsList"></div>
        </main>
    <footer class="bg-gray-100 text-center py-2 mt-auto">
        <p class="text-gray-600">&copy; 2025 BlogSport. Todos os direitos reservados.</p>
    </footer>
    </div>
    <script src="/js/hidePreview.js"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</body>

</html>
