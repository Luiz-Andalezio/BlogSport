<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle}">BlogSport</title>
    <link rel="icon" type="image/x-icon" th:href="@{/images/favicon.png}" />
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.4.1/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/tailwind.css">
</head>

<body class="bg-white min-h-screen flex">
    <!-- Left sidebar navbar -->
    <div th:replace="fragments/navbar :: navbar"></div>
    <!-- Main content area -->
    <div class="flex-1 flex flex-col">
        <!-- Top bar -->
        <div th:replace="fragments/topbar :: topbar"></div>
        <!-- Breadcrumbs -->
        <nav class="text-sm px-6 py-4 bg-gray-50 border-b border-gray-200 font-semibold mb-4" aria-label="Breadcrumb">
            <p class="text-gray-700">Home</p>
        </nav>
        <main class="p-6">
            <div th:replace="fragments/postsList :: postsList"></div>
        </main>
    </div>
    <script src="/js/hidePreview.js"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</body>

<!-- Right acc management/admin management sidebar navbar -->
<div th:if="${#authorization.expression('hasRole(''ADMIN'')')}">
    <div th:replace="fragments/adminSidebar :: adminSidebar"></div>
</div>

</html>
