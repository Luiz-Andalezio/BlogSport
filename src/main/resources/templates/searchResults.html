<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Search Results - BlogSport</title>
    <link rel="icon" type="image/x-icon" th:href="@{/images/favicon.png}" />
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.4.1/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/tailwind.css">
</head>

<body class="bg-white min-h-screen flex">
    <!-- Right acc management/admin management sidebar navbar -->
    <div th:if="${#authorization.expression('hasRole(''ADMIN'')')}">
        <div th:replace="fragments/adminSidebar :: adminSidebar"></div>
    </div>
    <!-- Left sidebar navbar -->
    <div th:replace="fragments/navbar :: navbar"></div>
    <!-- Main content area -->
    <div class="flex-1 flex flex-col">
        <!-- Top bar -->
        <div th:replace="fragments/topbar :: topbar"></div>
        <!-- Breadcrumbs -->
        <nav class="text-sm px-6 py-4 bg-gray-50 border-b border-gray-200 font-semibold mb-4" aria-label="Breadcrumb">
            <a href="/" class="text-green-700 hover:underline">Home</a>
            <span class="mx-2 text-gray-400">&gt;</span>
            <span class="text-black-700" th:text="${'Query: ' + query}">Query</span>
        </nav>
        <main class="p-8 max-w-4xl mx-auto">
            <h1 class="text-2xl font-bold mb-6">Results for "<span th:text="${query}"></span>"</h1>

            <section class="mb-8">
                <h2 class="text-xl font-semibold text-green-700 mb-2">Posts</h2>
                <div th:if="${#lists.isEmpty(posts)}" class="text-gray-500">No posts found.</div>
                <ul>
                    <li th:each="post : ${posts}" class="mb-4 border-b pb-2" style="list-style: none;">
                        <a th:href="@{/posts/{id}(id=${post.id})}"
                            class="text-lg font-semibold text-gray-700 hover:underline" th:text="${post.title}"></a>
                        <div class="text-xs text-gray-500 mt-1">
                            <span th:text="${post.createdAt}"></span>
                            &middot;
                            <span th:text="${post.user.name}"></span>
                        </div>
                        <div class="text-gray-700 text-sm mt-1" th:text="${#strings.abbreviate(post.content, 100)}">
                        </div>
                    </li>
                </ul>
            </section>

            <section>
                <h2 class="text-xl font-semibold text-green-700 mb-2" style="padding-top: 20px;">Categories</h2>
                <div th:if="${#lists.isEmpty(categories)}" class="text-gray-500">No categories found.</div>
                <ul>
                    <li th:each="category : ${categories}" class="mb-4 border-b pb-2" style="list-style: none;">
                        <a th:href="@{/categories/{id}(id=${category.id})}" class="font-semibold text-gray-700 hover:underline" th:text="${category.name}"></a>

                    </li>
                </ul>
            </section>
        </main>
    </div>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</body>

</html>
