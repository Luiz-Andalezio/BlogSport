<form th:action="@{/account/edit}" method="post" enctype="multipart/form-data" class="space-y-4">
    <div>
        <label>Name:</label>
        <input type="text" name="name" th:value="${user.name}" required class="border rounded px-3 py-2 w-full">
    </div>
    <div>
        <label>Email:</label>
        <input type="email" name="email" th:value="${user.email}" required class="border rounded px-3 py-2 w-full">
    </div>
    <div>
        <label>Profile Image:</label>
        <input type="file" name="file" class="border rounded px-3 py-2 w-full">
    </div>
    <div>
        <label>Current Password:</label>
        <input type="password" name="currentPassword" required class="border rounded px-3 py-2 w-full">
    </div>
    <div>
        <label>New Password:</label>
        <input type="password" name="newPassword" class="border rounded px-3 py-2 w-full">
    </div>
    <div>
        <label>Confirm New Password:</label>
        <input type="password" name="confirmPassword" class="border rounded px-3 py-2 w-full">
    </div>
    <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">Save Changes</button>
</form>
